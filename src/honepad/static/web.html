<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>honepad</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3e8; --text: #1d2330; --muted: #677085;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
    --code-bg: #f0f2f5; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --panel: #1a1d25; --line: #2b303b; --text: #e6e8ee; --muted: #9aa3b5;
      --accent: #4f8cff; --accent-text: #0b0d12; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
      --code-bg: #232733;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .3px; margin-right: 6px; }
  select, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .spacer { flex: 1; }
  .level { font-weight: 600; }
  .dots span { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--line); margin-right: 3px; }
  .dots span.on { background: var(--accent); }
  .clock { font: 700 20px var(--mono); min-width: 96px; text-align: right; }
  .clock.low { color: var(--warn); } .clock.out { color: var(--bad); }
  .clock.paused { color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(280px, 38%) 1fr; min-height: 0; }
  #spec { overflow: auto; padding: 14px 18px; border-right: 1px solid var(--line); background: var(--panel); }
  #spec h1 { font-size: 20px; margin: 0 0 8px; } #spec h2 { font-size: 16px; margin: 18px 0 6px; }
  #spec code { font-family: var(--mono); background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
  #spec pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow: auto; }
  #spec pre code { background: none; padding: 0; }
  #spec ul { padding-left: 20px; }
  .right { display: grid; grid-template-rows: auto 1fr minmax(120px, 34%); min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  .path { min-width: 0; max-width: 100%; color: var(--muted); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dirty { color: var(--warn); font-size: 12px; }
  #editorWrap { position: relative; min-height: 0; }
  .CodeMirror, #fallback { position: absolute; inset: 0; height: 100%; font: 13px/1.5 var(--mono); }
  #fallback { width: 100%; border: 0; padding: 8px; resize: none; background: var(--panel); color: var(--text); }
  .bottom { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-top: 1px solid var(--line);
    background: var(--code-bg); }
  .tabs { display: flex; gap: 2px; padding: 4px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 5px 12px; }
  .tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  .tabs .reddot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--bad);
    margin-left: 5px; vertical-align: middle; }
  .pane { overflow: auto; min-height: 0; }
  #out { margin: 0; padding: 10px 12px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; }
  #out .pass, .ok { color: var(--ok); font-weight: 700; } #out .fail, .bad { color: var(--bad); font-weight: 700; }
  #tests { padding: 8px 12px; font-size: 13px; }
  .tsum { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  .case { border: 1px solid var(--line); border-radius: 6px; margin: 4px 0; background: var(--panel); }
  .case > summary { cursor: pointer; padding: 4px 8px; list-style: none; display: flex; gap: 8px; align-items: center; }
  .case > summary::-webkit-details-marker { display: none; }
  .badge { font: 700 11px var(--mono); padding: 1px 6px; border-radius: 10px; }
  .badge.ok { background: rgba(21,128,61,.15); } .badge.bad { background: rgba(185,28,28,.15); }
  .badge.na { color: var(--muted); background: var(--code-bg); font-weight: 400; }
  .calls { margin: 0 0 6px; padding: 0 8px 6px 30px; font: 12.5px/1.6 var(--mono); }
  .calls div.hit { background: rgba(185,28,28,.12); border-radius: 4px; padding: 2px 4px; }
  .calls div.skip { opacity: .4; }
  .muted { color: var(--muted); }
  #reviewBtn.ready { background: var(--ok); color: #fff; border-color: var(--ok); }
  dialog { width: min(900px, 94vw); max-height: 88vh; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-head { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .dlg-body { padding: 12px 16px; overflow: auto; max-height: calc(88vh - 60px); }
  .dlg-body pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow: auto; font: 12px/1.45 var(--mono); }
  .dlg-body code { font-family: var(--mono); }
  #claudeOut h1, #claudeOut h2, #claudeOut h3 { font-size: 15px; margin: 14px 0 4px; }
  optgroup { font-style: normal; font-weight: 700; }
  #banner { display: none; position: fixed; left: 50%; top: 64px; transform: translateX(-50%);
    background: var(--ok); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; z-index: 20; }
  #pausedVeil { display: none; position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.55);
    color: #fff; font: 700 28px system-ui; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  #pausedVeil small { font: 400 14px system-ui; opacity: .85; }
  .spectabs { position: sticky; top: -14px; z-index: 2; display: flex; gap: 4px; align-items: center;
    margin: -14px -18px 10px; padding: 8px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .spectabs button { padding: 2px 10px; font-size: 13px; }
  .spectabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .spectabs button.cur::after { content: " •"; }
  #finishBtn { border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; padding: 4px 10px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #tabSol:not(.on) { color: var(--ok); border-color: var(--ok); font-weight: 600; }
  #solWrap { position: absolute; inset: 0; z-index: 5; background: var(--panel); }
  #solWrap .CodeMirror { position: absolute; inset: 0; }
  #solNote { position: absolute; right: 14px; top: 6px; z-index: 6; font-size: 12px; color: var(--muted); }
  .badge.hid { background: rgba(180,83,9,.18); color: var(--warn); }
  .notice { padding: 6px 10px; border-radius: 6px; background: rgba(185,28,28,.12); margin-bottom: 6px; }
  .notice.done { background: rgba(21,128,61,.12); }
  #solTa { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 8px; resize: none;
    font: 13px/1.5 var(--mono); background: var(--panel); color: var(--text); }
  .empty { color: var(--muted); padding: 30px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #spec { max-height: 40vh; } }
</style>
</head>
<body>
<header>
  <span class="brand">honepad</span>
  <select id="problem" title="Problem"></select>
  <select id="lang" title="Language"></select>
  <button id="startBtn" class="primary">Start</button>
  <button id="resetBtn" title="Start this problem over at level 1">Restart</button>
  <span class="spacer"></span>
  <span class="level" id="level"></span>
  <span class="dots" id="dots"></span>
  <span class="clock" id="clock">--:--</span>
  <button id="pauseBtn" disabled>Pause</button>
</header>
<div id="banner"></div>
<main>
  <section id="spec"><div class="spectabs" id="specTabs" hidden></div><div id="specBody"><div class="empty">Pick a problem and press Start.</div></div></section>
  <section class="right">
    <div class="toolbar">
      <button id="runBtn" disabled>Run <small>(Ctrl+Enter)</small></button>
      <button id="submitBtn" class="primary" disabled>Submit</button>
      <button id="finishBtn" disabled title="Grade once more and end the attempt. Then every level, the hidden tests and the solution open.">Final Submit</button>
      <button id="saveBtn" disabled>Save <small>(Ctrl+S)</small></button>
      <button id="reviewBtn" disabled title="Build a review pack for Claude or ChatGPT">Review</button>
      <span class="seg" id="codeTabs" hidden><button id="tabCode" class="on">Your code</button><button id="tabSol">Solution ★</button></span>
      <span class="dirty" id="dirty"></span>
      <span class="spacer"></span>
      <span class="path" id="path"></span>
    </div>
    <div id="editorWrap">
      <textarea id="fallback" spellcheck="false" placeholder="Start a problem to load your work file."></textarea>
      <div id="pausedVeil">PAUSED<small>Run and submit wait until you resume.</small></div>
      <div id="solWrap" hidden><span id="solNote">reference solution · read only</span><textarea id="solTa" readonly spellcheck="false"></textarea></div>
    </div>
    <div class="bottom">
      <div class="tabs">
        <button id="tabOut" class="on">Output</button>
        <button id="tabTests">Tests<span class="reddot" id="testsDot"></span></button>
      </div>
      <div class="pane" id="paneOut"><pre id="out">Run output shows here.</pre></div>
      <div class="pane" id="paneTests" hidden><div id="tests"><div class="muted">Start a problem to see its test cases.</div></div></div>
    </div>
  </section>
</main>
<dialog id="reviewDlg">
  <div class="dlg-head">
    <strong>Review</strong>
    <span class="muted" id="reviewNote"></span>
    <span class="spacer"></span>
    <button id="dlBtn">Download .md</button>
    <button id="copyBtn">Copy</button>
    <button id="claudeBtn" class="primary" hidden>Ask Claude Code</button>
    <button id="closeDlg">Close</button>
  </div>
  <div class="dlg-body">
    <div id="claudeOut"></div>
    <p class="muted" id="reviewPath"></p>
    <details id="packWrap"><summary>Review file (paste this into claude.ai or ChatGPT)</summary><pre id="reviewPack"></pre></details>
  </div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script>
"use strict";
const TOKEN = "__HONEPAD_TOKEN__";
const $ = (id) => document.getElementById(id);
let st = null, left = 0, savedText = "", busy = false, cm = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "X-Honepad-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  return res.json();
}

// ---- editor: CodeMirror when the CDN loaded, a textarea otherwise
const ta = $("fallback");
if (window.CodeMirror) {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  cm = CodeMirror.fromTextArea(ta, {
    mode: "text/x-java", lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
    matchBrackets: true, autoCloseBrackets: true, theme: dark ? "material-darker" : "default",
    extraKeys: { Tab: (c) => c.replaceSelection("    ") },
  });
  cm.on("change", markDirty);
} else {
  ta.addEventListener("input", markDirty);
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "    "); }
  });
}
const getCode = () => (cm ? cm.getValue() : ta.value);
function setCode(text, lang) {
  if (cm) { cm.setOption("mode", lang === "python3" ? "python" : "text/x-java"); cm.setValue(text); cm.clearHistory(); }
  else ta.value = text;
  savedText = text; markDirty();
}
function setReadOnly(on) { if (cm) cm.setOption("readOnly", on); else ta.readOnly = on; }
function markDirty() { $("dirty").textContent = getCode() !== savedText ? "unsaved" : ""; }

// ---- spec markdown: headings, lists, fenced code, inline code, bold
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(src) {
  const out = []; let para = [], list = null, code = null;
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<ul>" + list.map((i) => "<li>" + inline(i) + "</li>").join("") + "</ul>"); list = null; } };
  for (const line of src.split("\n")) {
    if (code !== null) {
      if (line.startsWith("```")) { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
      else code.push(line);
      continue;
    }
    if (line.startsWith("```")) { flushPara(); flushList(); code = []; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { flushPara(); (list ||= []).push(li[1]); continue; }
    if (list && /^\s+\S/.test(line)) { list[list.length - 1] += " " + line.trim(); continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    flushList(); para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join("\n");
}

// ---- clock
function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const mm = String(m).padStart(2, "0"), ss = String(x).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function drawClock() {
  const c = $("clock");
  if (!st || !st.session) { c.textContent = "--:--"; c.className = "clock"; return; }
  const s = st.session;
  c.textContent = (s.ended ? "FINISHED " : s.paused ? "PAUSED " : "") + fmt(left);
  c.className = "clock" + (s.paused || s.ended ? " paused" : left === 0 ? " out" : left < 600 ? " low" : "");
}
setInterval(() => {
  if (st && st.session && !st.session.paused && !st.session.ended && left > 0) {
    left -= 1; drawClock();
    if (left === 0) { refreshState(); flash("Time is up. Every level and the solution are open now"); }
  }
}, 1000);
// Finished: final submit, every level cleared, or the clock ran out.
const isOver = () => !!(st && st.session && (st.session.over || left === 0));
setInterval(() => { if (!busy) refreshState(); }, 15000);

// ---- state
async function refreshState() {
  st = await api("GET", "/api/state");
  const s = st.session;
  left = s ? s.left : 0;
  const pSel = $("problem");
  // Easiest first inside each group; problems without a score go last.
  const byDifficulty = st.problems.slice().sort((a, b) => (a.difficulty ?? 999) - (b.difficulty ?? 999));
  const firstOpen = byDifficulty.find((p) => p.original && !p.cleared) || byDifficulty[0];
  const keep = pSel.value || (s && s.problem) || firstOpen.id;
  const opt = (p) => {
    const mark = p.cleared ? " ✓" : p.unlocked ? ` (L${p.unlocked}/${p.levels})` : "";
    const tier = p.tier ? ` · ${p.tier}` : "";
    return `<option value="${p.id}" title="difficulty ${p.difficulty ?? "?"}/100">${p.original ? "★ " : ""}${p.id}${tier}${mark}</option>`;
  };
  pSel.innerHTML =
    `<optgroup label="Originals: finish these first, easiest first (${st.originals_done}/${st.originals_total} done)">` +
    byDifficulty.filter((p) => p.original).map(opt).join("") + "</optgroup>" +
    `<optgroup label="More practice (easiest first)">` + byDifficulty.filter((p) => !p.original).map(opt).join("") + "</optgroup>";
  pSel.value = st.problems.some((p) => p.id === keep) ? keep : firstOpen.id;
  const lSel = $("lang"), lkeep = lSel.value || (s && s.lang) || "java";
  lSel.innerHTML = st.langs.map((l) => `<option value="${l}">${l}</option>`).join("");
  lSel.value = st.langs.includes(lkeep) ? lkeep : st.langs[0];
  const over = isOver();
  $("level").textContent = !s ? "no session"
    : over ? `${s.problem} · FINISHED · ${s.cleared ? "all levels cleared" : `reached L${s.unlocked}/${s.levels}`}`
    : `${s.problem} · LEVEL ${s.unlocked}/${s.levels}`;
  $("dots").innerHTML = s ? Array.from({ length: s.levels }, (_, i) => `<span class="${i < s.unlocked ? "on" : ""}"></span>`).join("") : "";
  const paused = !!(s && s.paused);
  $("pauseBtn").disabled = !s || (!paused && over);
  $("pauseBtn").textContent = paused ? "Resume" : "Pause";
  $("pausedVeil").style.display = paused ? "flex" : "none";
  setReadOnly(paused || !s);
  $("codeTabs").hidden = !over;
  if (!over) showCode("code");
  if (lastOver !== undefined && over !== lastOver && s) {
    solLoaded = false; loadSpec(specLevel); renderTests();
    if (over) $("out").insertAdjacentHTML("beforeend", '\n\n<span class="pass">Attempt finished.</span> ' +
      "Open Solution ★ in the toolbar to compare, Tests → All levels for the hidden cases, and Review for feedback.");
  }
  lastOver = over;
  refreshButtons();
  drawClock();
  return st;
}

// ---- spec: one tab per level; later levels open once the attempt is over
let specLevel = 0, lastOver;
async function loadSpec(level) {
  const spec = await api("GET", "/api/spec" + (level ? "?level=" + level : ""));
  if (spec.error && level) return loadSpec(0);
  $("specBody").innerHTML = spec.markdown ? md(spec.markdown) : `<div class="empty">${esc(spec.error || "")}</div>`;
  const tabs = $("specTabs");
  tabs.hidden = !spec.levels;
  if (spec.levels) {
    specLevel = spec.level === spec.unlocked ? 0 : spec.level;
    tabs.innerHTML = '<span class="muted">Spec</span>' + Array.from({ length: spec.levels }, (_, i) => {
      const n = i + 1, locked = n > spec.visible;
      const cls = [n === spec.level ? "on" : "", n === spec.unlocked ? "cur" : ""].join(" ").trim();
      const title = locked ? "Locked until you reach it or finish the attempt" : n === spec.unlocked ? "Your current level" : "";
      return `<button data-level="${n}" class="${cls}"${locked ? " disabled" : ""} title="${title}">L${n}${locked ? " 🔒" : ""}</button>`;
    }).join("");
    tabs.querySelectorAll("button").forEach((b) => (b.onclick = () => { loadSpec(+b.dataset.level); $("spec").scrollTop = 0; }));
  }
}

// ---- solution view (read only, after the attempt)
let solCm = null, solLoaded = false;
async function showCode(which) {
  const sol = which === "sol";
  $("tabCode").classList.toggle("on", !sol);
  $("tabSol").classList.toggle("on", sol);
  $("solWrap").hidden = !sol;
  if (!sol) { if (cm) cm.refresh(); return; }
  if (!solLoaded) {
    const res = await api("GET", "/api/solution");
    // Only keep a real answer; an error (e.g. not finished yet) is asked again next time.
    solLoaded = res.code !== undefined || !!res.missing;
    const text = res.code !== undefined ? res.code
      : res.missing ? "No reference solution for this language." : "Unavailable: " + (res.error || "unknown error");
    if (window.CodeMirror) {
      if (!solCm) solCm = CodeMirror.fromTextArea($("solTa"), {
        readOnly: true, lineNumbers: true, theme: cm ? cm.getOption("theme") : "default",
      });
      solCm.setOption("mode", res.code === undefined ? null : st.session.lang === "python3" ? "python" : "text/x-java");
      solCm.setValue(text);
    } else $("solTa").value = text;
  }
  if (solCm) solCm.refresh();
}
$("tabCode").onclick = () => showCode("code");
$("tabSol").onclick = () => showCode("sol");

// ---- tests panel
let testsData = null, onlyFailing = false, testsStale = false;
// "All levels" view, after the attempt: every public and hidden case.
let testsScope = "level", allData = null, allReport = null, allError = "", levelFilter = 0;
function showTab(name) {
  $("tabOut").classList.toggle("on", name === "out");
  $("tabTests").classList.toggle("on", name === "tests");
  $("paneOut").hidden = name !== "out";
  $("paneTests").hidden = name !== "tests";
}
$("tabOut").onclick = () => showTab("out");
$("tabTests").onclick = () => showTab("tests");

async function loadCases() {
  testsData = await api("GET", "/api/cases");
  if (testsScope === "all" && isOver()) allData = await api("GET", "/api/cases?scope=all");
  renderTests();
}
async function setScope(scope) {
  testsScope = scope;
  if (scope === "all" && !allData) allData = await api("GET", "/api/cases?scope=all");
  renderTests();
}
async function runAll() {
  if (busy) return;
  if (getCode() !== savedText) await save();
  busy = true; refreshButtons(); show("Running every public and hidden case for every level ...");
  try {
    const res = await api("POST", "/api/check-all", {});
    if (res.error) { allReport = null; allError = res.error; show("FAIL: " + res.error); showTab("out"); }
    else {
      allReport = res.report; allError = "";
      show(`${res.ok ? "PASS" : "FAIL"}: ${res.report.passed}/${res.report.total} cases pass across every level (public + hidden)`);
    }
  } finally {
    busy = false; refreshButtons(); renderTests();
  }
}
const jv = (v) => JSON.stringify(v);
function gotText(actual) {
  return typeof actual === "string" && actual.startsWith("exc:") ? "threw " + actual.slice(4) : "returned " + jv(actual);
}
function renderTests() {
  const box = $("tests"), over = isOver(), all = over && testsScope === "all";
  const d = all ? allData : testsData;
  const scopeBar = over
    ? `<span class="seg"><button data-scope="level"${all ? "" : ' class="on"'}>Unlocked level</button>` +
      `<button data-scope="all"${all ? ' class="on"' : ""}>All levels</button></span>`
    : "";
  const wire = () => box.querySelectorAll("[data-scope]").forEach((b) => (b.onclick = () => setScope(b.dataset.scope)));
  if (!d || d.error) {
    box.innerHTML = `<div class="tsum">${scopeBar}</div><div class="muted">${esc((d && d.error) || "No session.")}</div>`;
    wire(); return;
  }
  const rep = all ? allReport : d.report && d.report.level === d.level && !testsStale ? d.report : null;
  const fails = new Map(rep ? rep.failed.map((f) => [f.case, f]) : []);
  if (!all) $("testsDot").style.display = fails.size || testsStale ? "inline-block" : "none";
  let cases = d.cases.slice();
  if (all && levelFilter) cases = cases.filter((c) => c.level === levelFilter);
  const shown = cases.length;
  if (rep) cases.sort((a, b) => (fails.has(b.id) ? 1 : 0) - (fails.has(a.id) ? 1 : 0));
  if (onlyFailing && rep) cases = cases.filter((c) => fails.has(c.id));
  const where = all ? (levelFilter ? `level ${levelFilter}` : `all ${d.level} levels`) : `level ${d.level}`;
  const head = rep
    ? `<strong class="${fails.size ? "bad" : "ok"}">${rep.passed}/${rep.total} passing</strong> · ${where}`
    : `<strong>${shown} cases</strong> · ${where} · <span class="muted">press ${all ? "Run all levels" : "Run"} to check them</span>`;
  const extra = all
    ? `<select id="lvlFilter"><option value="0">All levels</option>` +
      Array.from({ length: d.level }, (_, i) => `<option value="${i + 1}"${levelFilter === i + 1 ? " selected" : ""}>Level ${i + 1}</option>`).join("") +
      `</select><button id="runAllBtn"${busy ? " disabled" : ""}>Run all levels</button>`
    : "";
  let notice = "";
  if (!all && testsStale) notice = '<div class="notice">The last run produced no test results: your code did not compile or crashed. See the <a href="#" id="toOut">Output</a> tab.</div>';
  if (all && allError) notice = `<div class="notice">${esc(allError)}</div>`;
  const rows = cases.map((c) => {
    const f = fails.get(c.id);
    const badge = !rep ? '<span class="badge na">not run</span>'
      : f ? '<span class="badge bad">✗ fail</span>' : '<span class="badge ok">✓ pass</span>';
    const calls = c.calls.map((call, i) => {
      const line = `${esc(call.m)}(${call.a.map((x) => esc(jv(x))).join(", ")}) → ${esc(jv(call.e))}`;
      if (f && i === f.index) return `<div class="hit">${line}<br><span class="bad">✗ your code ${esc(gotText(f.actual))}, expected ${esc(jv(call.e))}</span></div>`;
      if (f && i > f.index) return `<div class="skip">${line}</div>`;
      return `<div>${line}</div>`;
    }).join("");
    const at = f ? ` <span class="muted">call ${f.index + 1}: ${esc(f.method)}</span>` : "";
    const hid = c.hidden ? '<span class="badge hid">hidden</span>' : "";
    return `<details class="case"${f ? " open" : ""}><summary>${badge}<code>${esc(c.id)}</code><span class="muted">L${c.level}</span>${hid}${at}</summary><div class="calls">${calls}</div></details>`;
  }).join("");
  const debug = rep && rep.debug && rep.debug.trim() ? `<p class="muted">Debug output</p><pre>${esc(rep.debug)}</pre>` : "";
  const foot = all ? "Public and hidden cases for every level, run against your current code."
    : "Public cases only. Hidden cases run on Submit." + (over ? " Switch to All levels to see them." : "");
  box.innerHTML = `<div class="tsum">${scopeBar}${head}<span class="spacer"></span>${extra}` +
    `<label><input type="checkbox" id="onlyFail"${onlyFailing ? " checked" : ""}> Show only failing</label></div>` +
    notice + rows + debug + `<p class="muted">${foot}</p>`;
  wire();
  $("onlyFail").onchange = (e) => { onlyFailing = e.target.checked; renderTests(); };
  if ($("toOut")) $("toOut").onclick = (e) => { e.preventDefault(); showTab("out"); };
  if (all) {
    $("lvlFilter").onchange = (e) => { levelFilter = +e.target.value; renderTests(); };
    $("runAllBtn").onclick = runAll;
  }
}

// ---- review
let reviewMd = "";
async function openReview() {
  const s = st && st.session;
  if (!s) return;
  const finished = isOver();
  if (!finished && !confirm("Mid-test review: hidden tests are withheld until you finish. Continue?")) return;
  if (getCode() !== savedText && !s.paused) await save();
  busy = true; refreshButtons(); show("Building review (runs your code against the tests) ...");
  try {
    const res = await api("POST", "/api/review", {});
    if (res.error) { show("FAIL: " + res.error); return; }
    show("OK: review file saved to " + res.path);
    reviewMd = res.markdown;
    $("reviewPack").textContent = res.markdown;
    $("reviewPath").textContent = "Saved to " + res.path;
    $("reviewNote").textContent = finished ? "attempt finished" : "mid-test (hidden cases withheld)";
    $("claudeOut").innerHTML = "";
    $("packWrap").open = !st.claude_available;
    $("claudeBtn").hidden = !st.claude_available;
    $("claudeBtn").disabled = false;
    $("reviewDlg").showModal();
  } finally {
    busy = false; refreshButtons();
  }
}
$("reviewBtn").onclick = openReview;
$("closeDlg").onclick = () => $("reviewDlg").close();
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(reviewMd); $("copyBtn").textContent = "Copied ✓"; }
  catch { $("packWrap").open = true; $("copyBtn").textContent = "Select the text below"; }
  setTimeout(() => ($("copyBtn").textContent = "Copy"), 2000);
};
$("dlBtn").onclick = () => {
  const s = st.session, a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([reviewMd], { type: "text/markdown" }));
  a.download = `review-${s.problem}-${s.lang}-L${s.unlocked}.md`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("claudeBtn").onclick = async () => {
  $("claudeBtn").disabled = true;
  $("claudeOut").innerHTML = '<p class="muted">Asking Claude Code. This can take a minute or two ...</p>';
  const res = await api("POST", "/api/review/claude", {});
  $("claudeOut").innerHTML = res.review ? md(res.review) + "<hr>" : `<p class="bad">${esc(res.error || "no answer")}</p>`;
  $("claudeBtn").disabled = false;
};

async function loadDesk() {
  specLevel = 0;
  await loadSpec(0);
  const work = await api("GET", "/api/work");
  if (work.code !== undefined) { setCode(work.code, st.session && st.session.lang); $("path").textContent = work.path; }
  else { setCode("", null); $("path").textContent = work.error || ""; }
  $("spec").scrollTop = 0;
  await loadCases();
}
// A different problem or a restart: forget everything tied to the old attempt.
function resetAttemptView() {
  testsStale = false; testsScope = "level"; allData = null; allReport = null; allError = ""; levelFilter = 0;
  solLoaded = false; showCode("code");
}

function show(text) {
  const html = esc(text || "")
    .replace(/^(PASS\b.*|OK\b.*|UNLOCK.*|DONE:.*)$/gm, '<span class="pass">$1</span>')
    .replace(/^(FAIL\b.*|PAUSED:.*|TIME UP.*|LOCKED.*)$/gm, '<span class="fail">$1</span>');
  $("out").innerHTML = html || "(no output)";
  $("out").scrollTop = 0;
}
function flash(msg) {
  const b = $("banner"); b.textContent = msg; b.style.display = "block";
  setTimeout(() => (b.style.display = "none"), 2600);
}

async function act(kind, body, label) {
  if (busy) return;
  busy = true; refreshButtons();
  show(label + " ...");
  try {
    const before = st && st.session ? st.session.unlocked : 0;
    const wasCleared = !!(st && st.session && st.session.cleared);
    const res = await api("POST", "/api/" + kind, body || {});
    show(res.error ? "FAIL: " + res.error : res.output);
    const graded = kind === "run" || kind === "submit" || kind === "finish";
    if (graded && !res.error) { savedText = body.code; markDirty(); }
    if (kind === "start") resetAttemptView();
    await refreshState();
    const now = st.session ? st.session.unlocked : 0;
    if (kind === "start") await loadDesk();
    if (graded) {
      // No report means nothing ran: a compile error or a crash. The reason is in Output.
      testsStale = !res.error && !res.report;
      if (now > before) { flash(`Level ${now} unlocked`); await loadDesk(); }
      else await loadCases();
      if (kind !== "finish" && res.report && res.report.failed.length) showTab("tests");
      else if (kind === "finish" || !res.ok || !res.report) showTab("out");
    }
    if (kind === "finish") flash("Attempt finished. Every level, the hidden tests and the solution are open");
    else if (graded && !wasCleared && st.session && st.session.cleared) flash("Problem cleared ✓ Solution ★ is in the toolbar");
  } catch (e) {
    show("FAIL: " + e);
  } finally {
    busy = false; refreshButtons();
  }
}
function refreshButtons() {
  const s = st && st.session, paused = !!(s && s.paused);
  const finished = isOver();
  for (const id of ["runBtn", "saveBtn"]) $(id).disabled = !s || paused || busy;
  $("submitBtn").disabled = !s || paused || busy || finished;
  $("finishBtn").disabled = !s || busy || finished;
  $("startBtn").disabled = busy; $("resetBtn").disabled = busy;
  if ($("runAllBtn")) $("runAllBtn").disabled = busy;
  $("reviewBtn").disabled = !s || busy;
  $("reviewBtn").classList.toggle("ready", finished);
  $("reviewBtn").textContent = finished ? "Review my attempt ★" : "Review";
}

async function save() {
  const code = getCode();
  const res = await api("PUT", "/api/work", { code });
  if (res.error) show("FAIL: " + res.error); else { savedText = code; markDirty(); }
}

$("startBtn").onclick = () => {
  const problem = $("problem").value, lang = $("lang").value;
  const s = st && st.session;
  if (s && getCode() !== savedText && !confirm("Discard unsaved changes?")) return;
  act("start", { problem, lang }, `Starting ${problem} (${lang})`);
};
$("resetBtn").onclick = () => {
  const problem = $("problem").value, lang = $("lang").value;
  if (!confirm(`Restart ${problem} at level 1? Your work file for it is rewritten from the stub.`)) return;
  act("start", { problem, lang, reset: true }, `Restarting ${problem}`);
};
$("runBtn").onclick = () => act("run", { code: getCode() }, "Running public tests");
$("submitBtn").onclick = () => {
  if (!confirm("Submit? If public and hidden tests pass, the next level unlocks.")) return;
  act("submit", { code: getCode() }, "Submitting");
};
$("finishBtn").onclick = () => {
  if (!confirm("Final submit grades your code one last time and ends the attempt.\n\n" +
    "After that you can read every level, see the hidden tests and the reference solution. " +
    "Restart the problem to try again.\n\nContinue?")) return;
  act("finish", { code: getCode() }, "Final submit");
};
$("saveBtn").onclick = save;
$("pauseBtn").onclick = () => {
  const paused = st && st.session && st.session.paused;
  if (!paused && getCode() !== savedText) save();
  act(paused ? "resume" : "pause", {}, paused ? "Resuming" : "Pausing");
};
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (!$("saveBtn").disabled) save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (!$("runBtn").disabled) $("runBtn").click(); }
});
window.addEventListener("beforeunload", (e) => { if (getCode() !== savedText) { e.preventDefault(); e.returnValue = ""; } });

refreshState().then((s) => { if (s.session) loadDesk(); });
</script>
</body>
</html>
